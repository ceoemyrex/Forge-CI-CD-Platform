[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-platform-cli"
version = "0.1.0"
description = "CLI for the Forge CI/CD platform"
requires-python = ">=3.10"
dependencies = [
  "requests==2.31.0",
]

[project.scripts]
forge = "cli.forge:main"

[tool.setuptools.packages.find]
include = ["cli*"]
