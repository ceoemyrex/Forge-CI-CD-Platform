# Forge platform configuration.
# Environment variables with matching names can override sensitive values.


engine:
  concurrency_limit: 4
  max_job_duration_sec: 1800
  default_cpu: 1.0
  default_memory: 512Mi
  docker_network: forge-isolated

registry:
  url: http://localhost:5000
  db_url: sqlite:///forge.db
  blob_root: ./storage/blobs

slack:
  webhook_url: "SLACK WEBHOOK URL"
  notify_users: ["@devops-team"]

auth:
  token_db_path: "/data/db/tokens.db"

public_url: http://localhost:8000
storage_root: ./storage

