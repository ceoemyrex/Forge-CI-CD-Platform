name: build-service-api
version: 0.1.0
dependencies:
  - name: lib-core
    version: "^1.0.0"
  - name: lib-http
    version: "^1.0.0"
jobs:
  build:
    runtime: alpine:3.18
    resources:
      cpu: 1.0
      memory: 512Mi
    steps:
      - name: test
        run: "test -f deps/lib-core/src/core.txt && test -f deps/lib-http/src/core.txt"
      - name: package
        run: "mkdir -p src && echo 'api' > src/api.txt && tar czf out.tar.gz src/"
artifacts:
  - name: service-api
    version: 0.1.0
    path: ./out.tar.gz
